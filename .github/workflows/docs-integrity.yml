name: Documentation integrity
on:
  push:
    paths:
      - "README.md"
      - "CONTRIBUTING.md"
      - "docs/**"
      - "scripts/check_docs.py"
      - "tests/test_docs_integrity.py"
      - ".github/workflows/docs-integrity.yml"
  pull_request:
    paths:
      - "README.md"
      - "CONTRIBUTING.md"
      - "docs/**"
      - "scripts/check_docs.py"
      - "tests/test_docs_integrity.py"
      - ".github/workflows/docs-integrity.yml"
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify documentation links, anchors, fences
        run: python3 scripts/check_docs.py
      - name: Run checker regression tests
        run: python3 -m unittest discover -s tests -p 'test_docs_integrity.py' -v
